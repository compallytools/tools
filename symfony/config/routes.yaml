# Routes chargées par module : chaque module importe ses contrôleurs (attributs #[Route]).
# Convention : host (config/modules.yaml, paramètre <module>.host)
# et préfixe de nom de route propres au module ; chaque module a son propre "/".
# Lister les routes : task console -- debug:router

colorally:
    resource: ../src/Colorally/Controller/
    type: attribute
    host: '%colorally.host%'
    name_prefix: colorally_

# Page d'accueil de dev (liste des modules), hors modules : host localhost, jamais en prod.
when@dev: &dev_routes
    common_dev:
        resource: ../src/Common/Controller/
        type: attribute
        host: localhost
        name_prefix: common_

when@test: *dev_routes
