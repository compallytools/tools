twig_component:
    # Composants anonymes (template seul) : @Common/components/<Nom>.html.twig
    anonymous_template_directory: '@Common/components/'
    # Composants PHP : un namespace par module
    defaults:
        App\Common\Twig\Components\: '@Common/components/'
        App\ContrastGrid\Twig\Components\:
            template_directory: '@ContrastGrid/components/'
            name_prefix: ContrastGrid
