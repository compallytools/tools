twig:
    file_name_pattern: '*.twig'
    # Un namespace Twig par module : @Common/..., @Colorally/...
    paths:
        '%kernel.project_dir%/src/Common/Resources/templates': Common
        '%kernel.project_dir%/src/Colorally/Resources/templates': Colorally

when@test:
    twig:
        strict_variables: true
