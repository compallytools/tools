security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # À remplacer par le provider des utilisateurs (entité) quand l'authentification sera ajoutée.
    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Firewall unique et stateful : pages Twig et API (/api) partagent la même session PHP.
        # Ne pas créer de firewall "api" stateless séparé.
        main:
            lazy: true
            provider: users_in_memory

    access_control:
        # - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
