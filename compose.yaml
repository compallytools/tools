services:
  php:
    build:
      context: docker/dev/php
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    volumes:
      - ./symfony:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-17}&charset=utf8"
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    tty: true

  database:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    build:
      context: docker/dev/node
      args:
        USER_ID: ${HOST_UID:-1000}
        GROUP_ID: ${HOST_GID:-1000}
    volumes:
      - ./symfony:/app
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_PORT: ${VITE_PORT:-5173}
    depends_on:
      - php

  doc:
    build: docker/dev/doc
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./doc:/doc
    ports:
      - "${DOC_PORT:-8001}:8000"

volumes:
  caddy_data:
  caddy_config:
  db_data:
